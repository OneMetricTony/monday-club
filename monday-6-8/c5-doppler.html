  <h1>🚓 C5 — Doppler Effect</h1>
  <p class="lede">Frequency shifts from relative motion — sound and light. 3 tries + hints, and a 🤖 Claude help button on every question.</p>
  <div id="quiz"></div>
  <footer>Monday Club · Physics · C5</footer>
</div>
<script src="../quiz.js"></script>
<script>
var QUESTIONS=[
 {topic:"Definition",q:"The Doppler effect is the change in observed <b>frequency</b> due to…",options:["the amplitude of the wave","relative motion between source and observer","the colour of the source","the medium's temperature only"],answer:1,explain:"It's the apparent frequency change caused by relative motion of source and observer."},
 {topic:"Approach",q:"As a source moves <b>toward</b> a stationary observer, the observed frequency is…",options:["higher than emitted","lower than emitted","unchanged","zero"],answer:0,explain:"Approaching → wavefronts bunch up → higher observed frequency (higher pitch)."},
 {topic:"Recede",q:"As a source moves <b>away</b> from a stationary observer, the observed frequency is…",options:["higher","lower","unchanged","doubled"],answer:1,explain:"Receding → wavefronts stretch out → lower observed frequency."},
 {topic:"Wavefronts",q:"In front of a moving source, the wavefronts are…",options:["stretched (longer λ)","compressed (shorter λ)","unchanged","destroyed"],answer:1,explain:"Ahead of the source the fronts crowd together → shorter wavelength → higher frequency."},
 {topic:"Wavefronts",q:"Behind a moving source, the wavefronts are…",options:["compressed","stretched (longer λ)","at right angles","stationary"],answer:1,explain:"Behind the source they spread out → longer wavelength → lower frequency."},
 {topic:"Observer",q:"If the observer moves <b>toward</b> a stationary source, the observed frequency…",options:["increases","decreases","stays equal","becomes zero"],answer:0,explain:"Moving into the wavefronts means meeting more per second → higher frequency."},
 {topic:"Pass-by",q:"As an ambulance passes you, the siren pitch…",options:["rises then stays high","is constant","drops from high to low as it passes","only rises"],answer:2,explain:"Approaching = higher pitch; receding after passing = lower pitch — a clear drop as it goes by."},
 {topic:"Formula",q:"For sound, a source moving toward a stationary observer gives…",options:["f′ = f (v − v_s)/v","f′ = f v/(v − v_s)","f′ = f v/(v + v_s)","f′ = f (v + v_s)/v"],answer:1,explain:"Approaching source: f′ = f · v/(v − v_s) — denominator shrinks, so f′ rises."},
 {topic:"No shift",q:"If source and observer move together with the <b>same</b> velocity, the observed frequency is…",options:["higher","lower","unchanged (no relative motion)","zero"],answer:2,explain:"No relative motion → no Doppler shift."},
 {topic:"Light",q:"Light from a galaxy moving <b>away</b> from us is…",options:["blue-shifted","red-shifted","unchanged","polarized"],answer:1,explain:"Receding light source → longer wavelength → shifted toward red (red-shift)."},
 {topic:"Light",q:"Light from a source moving <b>toward</b> us is…",options:["red-shifted","blue-shifted","unchanged","slowed"],answer:1,explain:"Approaching → shorter wavelength → blue-shift."},
 {topic:"Cosmology",q:"The red-shift of distant galaxies is evidence for…",options:["a static universe","an expanding universe","cooling of stars","the Doppler effect not applying to light"],answer:1,explain:"Galaxies receding (red-shifted) in all directions supports an expanding universe."},
 {topic:"Magnitude",q:"A larger source speed produces a…",options:["smaller frequency shift","larger frequency shift","shift only for light","no shift"],answer:1,explain:"Faster relative motion → bigger Doppler shift."},
 {topic:"Applications",q:"Police speed radar measures a car's speed using…",options:["the echo's loudness","the Doppler frequency shift of reflected waves","the time of sunrise","the car's colour"],answer:1,explain:"The reflected wave's frequency shift gives the speed (Doppler radar)."},
 {topic:"Scope",q:"The Doppler effect applies to…",options:["sound only","light only","all waves (sound and light)","standing waves only"],answer:2,explain:"It's a general wave phenomenon — both sound and light (and other waves)."},
 {topic:"Concept",q:"The Doppler shift happens because relative motion changes the…",options:["wave's speed in the medium","number of wavefronts reaching the observer per second","amplitude only","temperature"],answer:1,explain:"Relative motion changes how many wavefronts arrive per second → the observed frequency."}
,
 {topic:"Calc · approach",q:"A 300 Hz source moves toward a still observer at 40 m/s (v = 340). f′ = f·v/(v − v_s) =…",options:["268 Hz","340 Hz","300 Hz","383 Hz"],answer:1,explain:"f′ = 300 × 340/(340−40) = 300 × 340/300 = 340 Hz."},
 {topic:"Calc · recede",q:"The same 300 Hz source now recedes at 40 m/s. f′ = f·v/(v + v_s) =…",options:["340 Hz","268 Hz","300 Hz","240 Hz"],answer:1,explain:"f′ = 300 × 340/(340+40) = 102000/380 ≈ 268 Hz."},
 {topic:"Calc · observer",q:"An observer moves toward a still 400 Hz source at 34 m/s (v = 340). f′ = f·(v + v_o)/v =…",options:["360 Hz","440 Hz","400 Hz","374 Hz"],answer:1,explain:"f′ = 400 × (340+34)/340 = 400 × 374/340 = 440 Hz."},
 {topic:"Calc · observer",q:"An observer moves away from a still 400 Hz source at 34 m/s (v = 340). f′ = f·(v − v_o)/v =…",options:["440 Hz","360 Hz","400 Hz","306 Hz"],answer:1,explain:"f′ = 400 × (340−34)/340 = 400 × 306/340 = 360 Hz."},
 {topic:"Calc · approach",q:"A 200 Hz source approaches at 20 m/s (v = 340). f′ = f·v/(v − v_s) =…",options:["188.9 Hz","212.5 Hz","200 Hz","220 Hz"],answer:1,explain:"f′ = 200 × 340/320 = 68000/320 = 212.5 Hz."},
 {topic:"Calc · recede",q:"A 500 Hz source recedes at 34 m/s (v = 340). f′ = f·v/(v + v_s) =…",options:["550 Hz","455 Hz","500 Hz","466 Hz"],answer:1,explain:"f′ = 500 × 340/374 = 170000/374 ≈ 455 Hz."},
 {topic:"Calc · approach",q:"A 340 Hz source approaches at 34 m/s (v = 340). f′ = f·v/(v − v_s) =…",options:["306 Hz","378 Hz","340 Hz","408 Hz"],answer:1,explain:"f′ = 340 × 340/306 = 115600/306 ≈ 378 Hz."},
 {topic:"Calc · basics",q:"A stationary source emits sound of wavelength 2 m (v = 340 m/s). Its frequency is…",options:["170 Hz","680 Hz","2 Hz","342 Hz"],answer:0,explain:"f = v/λ = 340/2 = 170 Hz (no motion, so no shift)."},
 {topic:"Calc · reasoning",q:"As a source approaches you, the observed wavelength of its sound becomes…",options:["longer","shorter","unchanged","zero"],answer:1,explain:"Approaching crowds the wavefronts → shorter wavelength (higher frequency)."},
 {topic:"Calc · reasoning",q:"Doubling a source's approach speed (still below v) makes the frequency shift…",options:["smaller","larger","unchanged","negative"],answer:1,explain:"A bigger v_s shrinks (v − v_s), raising f′ further → a larger shift."}
];
MondayQuiz("quiz",QUESTIONS,{claudeHelp:true});
</script></body></html>
