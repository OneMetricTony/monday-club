  <h1>🌐 C3 — Wave Phenomena</h1>
  <p class="lede">Definitions and concepts: types of waves, reflection, refraction, diffraction, interference. 3 tries + hints, and a 🤖 Claude help button on every question.</p>
  <div id="quiz"></div>
  <footer>Monday Club · Physics · C3</footer>
</div>
<script src="../quiz.js"></script>
<script>
var QUESTIONS=[
 {topic:"Wave types",q:"In a <b>transverse</b> wave, the oscillation is…",options:["along the direction of travel","perpendicular to the direction of travel","always vertical","absent"],answer:1,explain:"Transverse = oscillation perpendicular to the direction of energy travel (e.g. light, water surface)."},
 {topic:"Wave types",q:"Which is a <b>longitudinal</b> wave?",options:["light","a wave on a string","sound in air","a water surface ripple"],answer:2,explain:"Sound is longitudinal — air particles oscillate along the travel direction (compressions & rarefactions)."},
 {topic:"Wave equation",q:"The wave speed equation is…",options:["v = f / λ","v = f λ","v = λ / f","v = f + λ"],answer:1,explain:"v = f λ (speed = frequency × wavelength)."},
 {topic:"Definitions",q:"Frequency is measured in…",options:["metres","seconds","hertz (Hz)","newtons"],answer:2,explain:"Frequency (cycles per second) is measured in hertz."},
 {topic:"Definitions",q:"The period T and frequency f are related by…",options:["T = f","T = 1/f","T = f²","T = v f"],answer:1,explain:"Period is the time for one cycle: T = 1/f."},
 {topic:"Definitions",q:"Wavelength is the distance between…",options:["a crest and the next trough","two adjacent points in phase (e.g. crest to crest)","the source and observer","two nodes"],answer:1,explain:"Wavelength λ is the distance between two consecutive in-phase points, like crest to crest."},
 {topic:"Reflection",q:"The law of reflection states that the angle of incidence…",options:["is larger than the angle of reflection","equals the angle of reflection","is always 90°","equals the wavelength"],answer:1,explain:"Angle of incidence = angle of reflection (both measured from the normal)."},
 {topic:"Refraction",q:"Refraction is the…",options:["bouncing of a wave off a surface","bending of a wave when its speed changes (new medium)","spreading of a wave through a gap","cancelling of two waves"],answer:1,explain:"Refraction = change of direction caused by a change in wave speed entering a new medium."},
 {topic:"Refraction",q:"Snell's law is written…",options:["n₁ sinθ₁ = n₂ sinθ₂","n₁ cosθ₁ = n₂ cosθ₂","n₁ θ₁ = n₂ θ₂","sinθ₁ = sinθ₂"],answer:0,explain:"n₁ sinθ₁ = n₂ sinθ₂."},
 {topic:"Refraction",q:"Entering a denser (higher-n) medium, light…",options:["speeds up and bends away from the normal","slows down and bends toward the normal","is unaffected","reflects only"],answer:1,explain:"Higher index → slower → bends toward the normal."},
 {topic:"Diffraction",q:"Diffraction is the…",options:["bending at a boundary due to speed change","spreading of waves through a gap or around an obstacle","reflection off a mirror","change in pitch from motion"],answer:1,explain:"Diffraction = spreading of waves as they pass through gaps or around edges."},
 {topic:"Diffraction",q:"Diffraction is most pronounced when the gap width is…",options:["much larger than the wavelength","about equal to the wavelength","zero","much smaller than an atom"],answer:1,explain:"Greatest spreading when the gap ≈ the wavelength."},
 {topic:"Superposition",q:"The principle of superposition says the resultant displacement is…",options:["the larger of the two waves","the sum of the individual displacements","always zero","the product of the two"],answer:1,explain:"Overlapping waves add: resultant = sum of the individual displacements."},
 {topic:"Interference",q:"Two waves interfere <b>constructively</b> when their path difference is…",options:["a whole number of wavelengths (nλ)","a half-odd number of wavelengths","exactly λ/4","always zero"],answer:0,explain:"Constructive (in phase): path difference = nλ."},
 {topic:"Interference",q:"<b>Destructive</b> interference occurs when the path difference is…",options:["nλ","(n + ½)λ","2λ","λ/8"],answer:1,explain:"Destructive (antiphase): path difference = (n + ½)λ."},
 {topic:"Interference",q:"Two sources are <b>coherent</b> if they have…",options:["different frequencies","the same frequency and a constant phase difference","the same amplitude only","no relationship"],answer:1,explain:"Coherent = same frequency and a constant phase relationship — needed for a stable interference pattern."},
 {topic:"Polarization",q:"Polarization can occur only for…",options:["longitudinal waves","transverse waves","sound waves","all waves equally"],answer:1,explain:"Only transverse waves can be polarized (they have a direction of oscillation perpendicular to travel)."},
 {topic:"Phase",q:"Two points oscillating in <b>antiphase</b> differ in phase by…",options:["0°","90°","180° (π rad)","360°"],answer:2,explain:"Antiphase = exactly out of step, a phase difference of 180° (π)."}
,
 {topic:"Calc · v=fλ",q:"A wave has frequency 50 Hz and wavelength 4 m. Its speed is…",options:["12.5 m/s","200 m/s","54 m/s","0.08 m/s"],answer:1,explain:"v = f λ = 50 × 4 = 200 m/s."},
 {topic:"Calc · v=fλ",q:"A wave travels at 340 m/s with frequency 170 Hz. Its wavelength is…",options:["2 m","0.5 m","510 m","57 800 m"],answer:0,explain:"λ = v/f = 340/170 = 2 m."},
 {topic:"Calc · v=fλ",q:"A wave of wavelength 0.5 m travels at 300 m/s. Its frequency is…",options:["150 Hz","600 Hz","0.0017 Hz","60 Hz"],answer:1,explain:"f = v/λ = 300/0.5 = 600 Hz."},
 {topic:"Calc · period",q:"A wave has frequency 25 Hz. Its period is…",options:["25 s","0.04 s","0.4 s","2.5 s"],answer:1,explain:"T = 1/f = 1/25 = 0.04 s."},
 {topic:"Calc · period",q:"A wave has period 0.02 s. Its frequency is…",options:["20 Hz","50 Hz","2 Hz","500 Hz"],answer:1,explain:"f = 1/T = 1/0.02 = 50 Hz."},
 {topic:"Calc · frequency",q:"20 complete waves pass a point in 4 s. The frequency is…",options:["80 Hz","5 Hz","0.2 Hz","24 Hz"],answer:1,explain:"f = cycles/time = 20/4 = 5 Hz."},
 {topic:"Calc · EM waves",q:"Light (c = 3×10⁸ m/s) has frequency 1×10⁸ Hz. Its wavelength is…",options:["3 m","0.33 m","3×10¹⁶ m","30 m"],answer:0,explain:"λ = c/f = 3×10⁸ / 1×10⁸ = 3 m."},
 {topic:"Calc · index",q:"A medium has refractive index n = 1.5. The speed of light in it (c = 3×10⁸) is…",options:["4.5×10⁸ m/s","2×10⁸ m/s","3×10⁸ m/s","1.5×10⁸ m/s"],answer:1,explain:"v = c/n = 3×10⁸ / 1.5 = 2×10⁸ m/s."},
 {topic:"Calc · index",q:"Light slows to 2×10⁸ m/s in glass (c = 3×10⁸). The refractive index is…",options:["0.67","1.5","6×10¹⁶","2"],answer:1,explain:"n = c/v = 3×10⁸ / 2×10⁸ = 1.5."},
 {topic:"Calc · Snell",q:"Light goes from air (n=1) at 30° into glass (n=1.5). Using n₁sinθ₁ = n₂sinθ₂, sinθ₂ ≈…",options:["0.75","0.33","0.50","1.5"],answer:1,explain:"sinθ₂ = (1·sin30°)/1.5 = 0.5/1.5 ≈ 0.33."},
 {topic:"Calc · TIR",q:"For a glass–air boundary with n = 1.5, the critical angle satisfies sinθc =…",options:["1.5","0.67","0.5","0.33"],answer:1,explain:"sinθc = 1/n = 1/1.5 ≈ 0.67."},
 {topic:"Calc · geometry",q:"The distance from a crest to the adjacent trough is 3 m. The wavelength is…",options:["3 m","6 m","1.5 m","12 m"],answer:1,explain:"Crest→trough is half a wavelength, so λ = 2 × 3 = 6 m."},
 {topic:"Calc · sound",q:"Sound at 340 m/s has wavelength 1.7 m. Its frequency is…",options:["200 Hz","578 Hz","2 Hz","340 Hz"],answer:0,explain:"f = v/λ = 340/1.7 = 200 Hz."},
 {topic:"Calc · period",q:"A wave travels at 10 m/s with wavelength 2 m. Its period is…",options:["5 s","0.2 s","20 s","0.5 s"],answer:1,explain:"f = v/λ = 5 Hz, so T = 1/f = 0.2 s."},
 {topic:"Calc · reasoning",q:"If the frequency of a wave doubles while its speed stays the same, the wavelength…",options:["doubles","halves","is unchanged","quadruples"],answer:1,explain:"v = fλ is fixed, so doubling f halves λ."}
];
MondayQuiz("quiz",QUESTIONS,{claudeHelp:true});
</script></body></html>
