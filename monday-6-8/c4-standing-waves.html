  <h1>🎻 C4 — Standing Waves</h1>
  <p class="lede">Nodes, antinodes, boundary conditions and harmonics. 3 tries + hints, and a 🤖 Claude help button on every question.</p>
  <div id="quiz"></div>
  <footer>Monday Club · Physics · C4</footer>
</div>
<script src="../quiz.js"></script>
<script>
var QUESTIONS=[
 {topic:"Formation",q:"A standing wave is formed by two waves that have…",options:["different frequencies travelling the same way","equal frequency & amplitude travelling in opposite directions","the same direction and different speeds","no relationship"],answer:1,explain:"Two identical waves (equal f and amplitude) travelling opposite ways superpose into a standing wave."},
 {topic:"Nodes",q:"A <b>node</b> is a point of…",options:["maximum amplitude","zero amplitude","maximum speed","maximum frequency"],answer:1,explain:"At a node the two waves always cancel → zero amplitude."},
 {topic:"Antinodes",q:"An <b>antinode</b> is a point of…",options:["zero amplitude","maximum amplitude","zero velocity always","fixed boundary"],answer:1,explain:"Antinodes oscillate with maximum amplitude."},
 {topic:"Geometry",q:"The distance between two adjacent nodes is…",options:["λ","λ/2","λ/4","2λ"],answer:1,explain:"Adjacent nodes are half a wavelength apart (λ/2)."},
 {topic:"Geometry",q:"The distance from a node to the next antinode is…",options:["λ/2","λ/4","λ","λ/8"],answer:1,explain:"Node to adjacent antinode is a quarter wavelength (λ/4)."},
 {topic:"Energy",q:"A standing wave transfers energy along the medium…",options:["yes, like a travelling wave","no — energy stays localised (no net transport)","only at nodes","only at high frequency"],answer:1,explain:"Standing waves store energy in place; there is no net energy transport along the medium."},
 {topic:"String",q:"For a string fixed at both ends, the fundamental wavelength is…",options:["λ = L","λ = 2L","λ = 4L","λ = L/2"],answer:1,explain:"Both ends are nodes; the simplest fit is half a wavelength along L → λ = 2L."},
 {topic:"String",q:"The fundamental frequency of a string fixed at both ends is…",options:["v/L","v/2L","v/4L","2v/L"],answer:1,explain:"f₁ = v/(2L), since λ₁ = 2L and f = v/λ."},
 {topic:"Harmonics",q:"For a string fixed at both ends, the nth harmonic frequency is…",options:["fₙ = n v/2L","fₙ = n v/4L","fₙ = v/(nL)","fₙ = n²v/2L"],answer:0,explain:"fₙ = n·v/2L for n = 1, 2, 3, …"},
 {topic:"Pipes",q:"A pipe <b>open at both ends</b> has, at each open end, a…",options:["node","antinode","fixed point","zero of pressure only"],answer:1,explain:"Open ends are displacement antinodes; it supports all harmonics (n = 1,2,3,…)."},
 {topic:"Pipes",q:"A pipe <b>closed at one end</b> supports…",options:["all harmonics","only even harmonics","only odd harmonics","no harmonics"],answer:2,explain:"Closed-one-end pipes have a node at the closed end and antinode at the open end → only odd harmonics (n = 1,3,5…)."},
 {topic:"Pipes",q:"For a pipe closed at one end, the fundamental wavelength is…",options:["λ = 2L","λ = 4L","λ = L","λ = L/2"],answer:1,explain:"Node at closed end + antinode at open end fits a quarter wave → λ = 4L."},
 {topic:"Phase",q:"At a node, the two superposing waves are…",options:["in phase (reinforce)","in antiphase (cancel)","at 90°","absent"],answer:1,explain:"At a node the waves are always in antiphase, so they cancel to zero."},
 {topic:"Resonance",q:"Resonance happens when a system is driven at…",options:["any frequency","one of its natural (resonant) frequencies","zero frequency","double its length"],answer:1,explain:"Driving at a natural frequency gives a large-amplitude standing wave — resonance."},
 {topic:"Harmonics",q:"How many antinodes does the nth harmonic of a string (fixed both ends) have?",options:["n","n − 1","2n","1"],answer:0,explain:"The nth harmonic has n antinodes (and n+1 nodes counting the ends)."},
 {topic:"Compare",q:"Compared with a travelling wave, a standing wave has…",options:["nodes that move along","fixed nodes and no net energy transport","a single moving crest","no amplitude"],answer:1,explain:"Standing waves have stationary nodes/antinodes and don't transport energy along the medium."},
 {topic:"String",q:"Increasing the tension in a string (same length) makes the wave speed…",options:["lower, lowering the frequency","higher, raising the frequency","unchanged","zero"],answer:1,explain:"Higher tension → higher wave speed → higher resonant frequencies (the string sounds higher)."}
,
 {topic:"Calc · string",q:"A string fixed at both ends has L = 1 m and wave speed 200 m/s. Its fundamental frequency is…",options:["50 Hz","100 Hz","200 Hz","400 Hz"],answer:1,explain:"f₁ = v/2L = 200/(2·1) = 100 Hz."},
 {topic:"Calc · harmonics",q:"For that same string (f₁ = 100 Hz), the 3rd harmonic is…",options:["103 Hz","300 Hz","33 Hz","150 Hz"],answer:1,explain:"fₙ = n·f₁, so f₃ = 3 × 100 = 300 Hz."},
 {topic:"Calc · string",q:"A string fixed at both ends has L = 0.5 m. Its fundamental wavelength is…",options:["0.5 m","1 m","0.25 m","2 m"],answer:1,explain:"Fundamental: λ = 2L = 2 × 0.5 = 1 m."},
 {topic:"Calc · pipe",q:"A pipe open at both ends, L = 0.5 m, sound speed 340 m/s. Fundamental frequency is…",options:["170 Hz","340 Hz","680 Hz","85 Hz"],answer:1,explain:"Open–open: f₁ = v/2L = 340/1 = 340 Hz."},
 {topic:"Calc · pipe",q:"A pipe closed at one end, L = 0.25 m, sound speed 340 m/s. Fundamental frequency is…",options:["170 Hz","340 Hz","680 Hz","85 Hz"],answer:1,explain:"Closed–open: f₁ = v/4L = 340/(4·0.25) = 340 Hz."},
 {topic:"Calc · pipe",q:"For a closed-end pipe with fundamental f₁, the next possible harmonic is…",options:["2f₁","3f₁","1.5f₁","4f₁"],answer:1,explain:"Closed pipes have only odd harmonics, so the next is 3f₁."},
 {topic:"Calc · geometry",q:"Adjacent nodes of a standing wave are 0.4 m apart. The wavelength is…",options:["0.2 m","0.8 m","0.4 m","1.6 m"],answer:1,explain:"Node spacing = λ/2, so λ = 2 × 0.4 = 0.8 m."},
 {topic:"Calc · harmonics",q:"A guitar string sounds its fundamental at 256 Hz. Its 2nd harmonic is…",options:["128 Hz","512 Hz","258 Hz","768 Hz"],answer:1,explain:"f₂ = 2 × 256 = 512 Hz."},
 {topic:"Calc · string",q:"A string fixed at both ends, L = 0.6 m, wave speed 300 m/s. Fundamental frequency is…",options:["250 Hz","500 Hz","180 Hz","125 Hz"],answer:0,explain:"f₁ = v/2L = 300/(2·0.6) = 250 Hz."},
 {topic:"Calc · harmonics",q:"A string's 5th harmonic is 600 Hz. Its fundamental frequency is…",options:["3000 Hz","120 Hz","60 Hz","300 Hz"],answer:1,explain:"f₁ = f₅/5 = 600/5 = 120 Hz."},
 {topic:"Calc · harmonics",q:"How many antinodes does the 4th harmonic of a string fixed at both ends have?",options:["3","4","5","8"],answer:1,explain:"The nth harmonic has n antinodes → 4."},
 {topic:"Calc · pipe",q:"A pipe open at both ends has fundamental 170 Hz. Its 2nd harmonic is…",options:["85 Hz","340 Hz","510 Hz","170 Hz"],answer:1,explain:"Open–open supports all harmonics: f₂ = 2 × 170 = 340 Hz."},
 {topic:"Calc · pipe",q:"A pipe closed at one end has L = 0.85 m. Its fundamental wavelength is…",options:["0.85 m","1.7 m","3.4 m","0.43 m"],answer:2,explain:"Closed–open fundamental: λ = 4L = 4 × 0.85 = 3.4 m."},
 {topic:"Calc · v=fλ",q:"A standing wave has wavelength 1.2 m at frequency 250 Hz. The wave speed is…",options:["208 m/s","300 m/s","0.0048 m/s","251 m/s"],answer:1,explain:"v = f λ = 250 × 1.2 = 300 m/s."},
 {topic:"Calc · reasoning",q:"Increasing a string's length (same wave speed) makes its fundamental frequency…",options:["higher","lower","unchanged","zero"],answer:1,explain:"f₁ = v/2L: larger L → lower f₁."}
];
MondayQuiz("quiz",QUESTIONS,{claudeHelp:true});
</script></body></html>
